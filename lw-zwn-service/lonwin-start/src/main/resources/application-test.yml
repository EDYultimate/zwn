# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

  # 数据源配置
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://10.3.247.73:5236/hw_eg_spjk?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
    username: hw_eg_spjk
    password: Spjk@123!
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: lonwin-dev-hikari
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 3000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.DmDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: true
    open-in-view: false


  # 控制台彩色输出
  output:
    ansi:
      enabled: always

  # 开发工具
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
    banner: false

# JWT配置
jwt:
  secret: lonwin-dev-jwt-secret-key-2024-for-development-environment-only
  expiration: 86400
  refresh-expiration: 604800
  header: Authorization
  token-start-with: Bearer

# 日志配置
logging:
  level:
    cn.lonwin: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  file:
    name: ./logs/lonwin-dev.log