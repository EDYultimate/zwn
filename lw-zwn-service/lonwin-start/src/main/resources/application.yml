      # ===== 异常图片智能识别（截图后调用目标检测服务） =====
      # 是否开启：true=每轮截图后识别图片，命中异常类别即记为「异常抓拍」
      detect-enabled: true
      # 目标检测服务地址（YOLO 多模型检测服务，接口文档 /docs）
