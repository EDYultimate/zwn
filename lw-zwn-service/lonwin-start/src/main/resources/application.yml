# ========== 服务器配置 ==========
server:
  port: 9080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    connection-timeout: 30000
    max-connections: 10000
    accept-count: 100
    threads:
      max: 200
      min-spare: 10
      max-queue-size: 100
    basedir: ./temp/tomcat
    # 表单POST请求体最大大小（文件上传关键配置，默认仅2MB）
    max-http-form-post-size: 200MB
    # Tomcat单次读取/吞入的最大字节数（默认2MB，过小会导致大文件上传连接被断开）
    max-swallow-size: 200MB

# ========== Spring配置 ==========
spring:
  # 应用信息
  application:
    name: lonwin-platform
    version: 1.0.0

  # 文件上传配置（关键：默认 max-file-size 仅 1MB，max-request-size 仅 10MB）
  servlet:
    multipart:
      # 单个文件最大 100MB
      max-file-size: 100MB
      # 单次请求所有文件总大小
      max-request-size: 200MB
      # 文件阈值，超过写入临时磁盘
      file-size-threshold: 10MB
      # 启用文件上传
      enabled: true

  # 激活的环境配置
  profiles:
    active: dev
    group:
      dev: dev
      test: test,dev
      prod: prod

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null


# ========== 文件存储配置 ==========
# 注意：此配置必须放在主启动模块的 application.yml 中才会生效
# （依赖 jar 中的 application.yml 不会被加载）
file:
  # 默认存储桶。yqbucket 即本地 MinIO 中已有的知识库原文桶
  # （docFiles / imgFiles 目录，Qdrant payload 的 filePath 指向这里）
  bucketName: yqbucket

  # 本地文件存储：接入 MinIO 后关闭（matchIfMissing=true，必须显式写 false）
  local:
    enable: false
    # 切回本地磁盘时把上面的 oss.enable 改 false、local.enable 改 true
    basePath: /home/java1/tjwr/uploadfiles

  # MinIO / S3 兼容对象存储
  oss:
    enable: true
    # 7350 是本地 S3 API 宿主端口（容器内 9000），7351 只是 Web 控制台。
    # 本地端口映射见 D:\dockerVolumes\knowledge\docker-compose.yml（7 开头）；
    # 连服务器 MinIO 时用环境变量 MINIO_ENDPOINT=http://<服务器IP>:9000 覆盖。
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:7350}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:lonwin_local_minio_2026}
    # MinIO 不校验 region，但 AWS SDK 需要非空值
    region: us-east-1
    # MinIO 必须用 path-style（http://host/bucket/key）
    path-style-access: true
    max-connections: 100

  # 知识库原文查看端点（lonwin-framework-file / ResourceViewController）
  view:
    enabled: true
    # 留空则跟随 file.bucketName；历史库独立桶时可单独指定
    bucket: yqbucket
    allowed-prefixes: [docFiles, imgFiles]
    inline-extensions: [pdf, png, jpg, jpeg, gif, webp, svg, txt]
    # 兼容 knowledge-platform 写入的带前导斜杠对象 key
    try-leading-slash-key: true


# ========== SpringDoc配置 ==========
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 2
    default-model-rendering: example
  packages-to-scan: cn.lonwin
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: true
  cache:
    disabled: true

# ========== Actuator配置 ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true

logging:
  level:
    org.springframework.security: debug



